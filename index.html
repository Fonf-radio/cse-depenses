<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSE — Suivi des dépenses</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      font-size: 14px;
    }

    /* LOGIN */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f5f5f7;
    }
    .login-box {
      background: white;
      padding: 48px 40px;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 360px;
    }
    .login-box h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1d1d1f;
      margin-bottom: 6px;
    }
    .login-box p {
      font-size: 13px;
      color: #6e6e73;
      margin-bottom: 32px;
    }
    .login-box label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #6e6e73;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .login-box input {
      display: block;
      width: 100%;
      padding: 11px 14px;
      margin-bottom: 16px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: #1d1d1f;
      background: #fafafa;
      transition: border 0.2s;
      outline: none;
    }
    .login-box input:focus {
      border-color: #0071e3;
      background: white;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .login-box button:hover { background: #0077ed; }
    .login-box button:active { background: #005bbf; }
    #login-error {
      color: #ff3b30;
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
    }

    /* APP */
    #app { display: none; }

    /* HEADER */
    .topbar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #e5e5ea;
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-left h1 {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.2px;
    }
    .topbar-left span {
      font-size: 12px;
      color: #6e6e73;
      margin-left: 10px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .user-pill {
      background: #f5f5f7;
      border: 1px solid #e5e5ea;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
      color: #1d1d1f;
      font-weight: 500;
    }
    .btn-logout {
      background: none;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      color: #6e6e73;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .btn-logout:hover {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    /* CONTENU */
    .content { padding: 32px; max-width: 1400px; margin: 0 auto; }

    /* CARTES TOTAUX */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #e5e5ea;
    }
    .stat-card .label {
      font-size: 11px;
      font-weight: 500;
      color: #6e6e73;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-size: 24px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.5px;
    }
    .stat-card.blue .value { color: #0071e3; }
    .stat-card.green .value { color: #34c759; }
    .stat-card.red .value { color: #ff3b30; }
    .stat-divider {
      grid-column: span 6;
      height: 1px;
      background: #e5e5ea;
      margin: 2px 0;
      display: none;
    }

    /* FILTRES */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 280px;
    }
    .search-wrap input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      background: white;
      color: #1d1d1f;
      outline: none;
      transition: border 0.2s;
    }
    .search-wrap input:focus { border-color: #0071e3; }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 14px;
    }
    .toolbar select {
      padding: 9px 14px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      background: white;
      color: #1d1d1f;
      outline: none;
      cursor: pointer;
    }
    .toolbar select:focus { border-color: #0071e3; }

    /* TABLEAU */
    .table-container {
      background: white;
      border-radius: 14px;
      border: 1px solid #e5e5ea;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead tr {
      border-bottom: 1px solid #e5e5ea;
    }
    thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: #6e6e73;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: #fafafa;
    }
    tbody tr {
      border-bottom: 1px solid #f2f2f7;
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f5f5f7; }
    td {
      padding: 12px 16px;
      color: #1d1d1f;
      font-size: 13px;
    }
    td.muted { color: #6e6e73; }
    td.num { font-variant-numeric: tabular-nums; }

    .input-amount {
      width: 80px;
      padding: 6px 10px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: #1d1d1f;
      background: #fafafa;
      outline: none;
      transition: border 0.2s;
    }
    .input-amount:focus {
      border-color: #0071e3;
      background: white;
    }

    .btn-validate {
      padding: 6px 14px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-vac {
      background: #e8f0fe;
      color: #0071e3;
    }
    .btn-vac:hover { background: #0071e3; color: white; }
    .btn-sport {
      background: #e9f9ee;
      color: #34c759;
    }
    .btn-sport:hover { background: #34c759; color: white; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;

    .badge-vac { background: #e8f0fe; color: #0071e3; }
    .badge-sport { background: #e9f9ee; color: #34c759; }

      display: inline-block;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #f5f5f7;
      color: #6e6e73;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      line-height: 22px;
    }

    /* ADMIN LINK */
    .admin-link {
      display: none;
      margin-top: 20px;
      text-align: right;
      font-size: 12px;
      color: #6e6e73;
      text-decoration: none;
    }
    .admin-link:hover { color: #0071e3; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>CSE</h1>
    <p>Suivi des dépenses — Connectez-vous pour continuer</p>
    <label>Identifiant</label>
    <input type="text" id="input-user" placeholder="Votre identifiant" autocomplete="username" />
    <label>Mot de passe</label>
    <input type="password" id="input-pass" placeholder="••••••••" autocomplete="current-password" />
    <button onclick="login()">Se connecter</button>
    <p id="login-error"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <h1>CSE — Suivi des dépenses <span id="user-label"></span></h1>
    </div>
    <div class="topbar-right">
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <div class="content">

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Vacances — Prévu</div>
        <div class="value blue" id="total-vac-prevu">0 €</div>
      </div>
      <div class="stat-card">
        <div class="label">Vacances — Validé</div>
        <div class="value green" id="total-vac-valide">0 €</div>
      </div>
      <div class="stat-card">
        <div class="label">Vacances — Restant</div>
        <div class="value red" id="total-vac-reste">0 €</div>
      </div>
      <div class="stat-card">
        <div class="label">Sport — Prévu</div>
        <div class="value blue" id="total-sport-prevu">0 €</div>
      </div>
      <div class="stat-card">
        <div class="label">Sport — Validé</div>
        <div class="value green" id="total-sport-valide">0 €</div>
      </div>
      <div class="stat-card">
        <div class="label">Sport — Restant</div>
        <div class="value red" id="total-sport-reste">0 €</div>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">&#9906;</span>
        <input type="text" id="search" placeholder="Rechercher un nom..." oninput="renderTable()" />
      </div>
      <select id="filter-cat" onchange="renderTable()">
        <option value="">Toutes catégories</option>
        <option value="A">Catégorie A</option>
        <option value="B">Catégorie B</option>
        <option value="C">Catégorie C</option>
        <option value="D">Catégorie D</option>
        <option value="E">Catégorie E</option>
      </select>
      <select id="filter-status" onchange="renderTable()">
        <option value="">Tous les statuts</option>
        <option value="vac_valide">Vacances validées</option>
        <option value="sport_valide">Sport validé</option>
        <option value="vac_pending">Vacances en attente</option>
        <option value="sport_pending">Sport en attente</option>
      </select>
    </div>

    <!-- TABLEAU -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Cat.</th>
            <th>Vacances</th>
            <th>Statut</th>
            <th>Sport</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <a href="admin.html" id="admin-link" class="admin-link">Journal des validations</a>

  </div>
</div>
