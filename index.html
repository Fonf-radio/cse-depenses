<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSE - Suivi des dépenses</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }

    #login-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100vh;
    }
    #login-screen h1 { margin-bottom: 20px; color: #1a73e8; }
    #login-screen input {
      display: block; width: 280px; padding: 10px;
      margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }
    #login-screen button {
      width: 280px; padding: 10px; background: #1a73e8;
      color: white; border: none; border-radius: 6px;
      font-size: 15px; cursor: pointer; margin-top: 10px;
    }
    #login-screen button:hover { background: #1558b0; }
    #login-error { color: red; font-size: 13px; margin-top: 8px; }

    #app { display: none; padding: 20px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #1a73e8; color: white; padding: 14px 20px;
      border-radius: 8px; margin-bottom: 20px;
    }
    header h1 { font-size: 20px; }
    header div { display: flex; gap: 10px; align-items: center; }
    #user-label { font-size: 14px; }
    header button {
      background: white; color: #1a73e8; border: none;
      padding: 6px 14px; border-radius: 5px; cursor: pointer; font-size: 13px;
    }

    .totaux { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .card {
      background: white; border-radius: 8px; padding: 16px 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); flex: 1; min-width: 180px;
    }
    .card h3 { font-size: 13px; color: #888; margin-bottom: 6px; }
    .card p { font-size: 22px; font-weight: bold; color: #1a73e8; }
    .card.sport p { color: #34a853; }
    .card.reste p { color: #ea4335; }

    .table-wrap { overflow-x: auto; background: white; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #1a73e8; color: white; }
    thead th { padding: 12px 16px; text-align: left; }
    tbody tr:nth-child(even) { background: #f8f9fa; }
    tbody tr:hover { background: #e8f0fe; }
    td { padding: 10px 16px; border-bottom: 1px solid #eee; }
    td.validated { color: #888; }

    input[type="text"].edit-field {
      width: 80px; border: 1px solid #ccc; border-radius: 4px;
      padding: 4px 8px; font-size: 14px;
    }
    .btn-vac {
      background: #1a73e8; color: white; border: none;
      padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px;
      white-space: nowrap;
    }
    .btn-sport {
      background: #34a853; color: white; border: none;
      padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px;
      white-space: nowrap;
    }
    .btn-vac:disabled, .btn-sport:disabled {
      background: #aaa; cursor: not-allowed;
    }
    .badge-vac {
      background: #e8f0fe; color: #1a73e8;
      padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold;
    }
    .badge-sport {
      background: #e6f4ea; color: #34a853;
      padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold;
    }

    .filters { margin-bottom: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
    .filters input, .filters select {
      padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }

    #admin-link-wrap { margin-top: 20px; text-align: right; }
    #admin-link-wrap a { color: #888; font-size: 12px; text-decoration: none; }
    #admin-link-wrap a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div id="login-screen">
  <h1>🏢 CSE - Suivi des dépenses</h1>
  <input type="text" id="input-user" placeholder="Identifiant" />
  <input type="password" id="input-pass" placeholder="Mot de passe" />
  <button onclick="login()">Se connecter</button>
  <p id="login-error"></p>
</div>

<div id="app">
  <header>
    <h1>🏢 CSE - Suivi des dépenses</h1>
    <div>
      <span id="user-label"></span>
      <button onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <div class="totaux">
    <div class="card">
      <h3>💼 Total Vacances prévu</h3>
      <p id="total-vac-prevu">0 €</p>
    </div>
    <div class="card">
      <h3>✅ Vacances validées</h3>
      <p id="total-vac-valide">0 €</p>
    </div>
    <div class="card reste">
      <h3>⏳ Vacances restantes</h3>
      <p id="total-vac-reste">0 €</p>
    </div>
    <div class="card sport">
      <h3>🏅 Total Sport prévu</h3>
      <p id="total-sport-prevu">0 €</p>
    </div>
    <div class="card sport">
      <h3>✅ Sport validé</h3>
      <p id="total-sport-valide">0 €</p>
    </div>
    <div class="card reste">
      <h3>⏳ Sport restant</h3>
      <p id="total-sport-reste">0 €</p>
    </div>
  </div>

  <div class="filters">
    <input type="text" id="search" placeholder="🔍 Rechercher un nom..." oninput="renderTable()" />
    <select id="filter-cat" onchange="renderTable()">
      <option value="">Toutes catégories</option>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
      <option value="E">E</option>
    </select>
    <select id="filter-status" onchange="renderTable()">
      <option value="">Tous statuts</option>
      <option value="vac_valide">Vacances validées</option>
      <option value="sport_valide">Sport validé</option>
      <option value="vac_pending">Vacances en attente</option>
      <option value="sport_pending">Sport en attente</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Cat.</th>
          <th>Vacances (€)</th>
          <th>Statut Vacances</th>
          <th>Sport (€)</th>
          <th>Statut Sport</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div id="admin-link-wrap">
    <a href="admin.html" id="admin-link" style="display:none">⚙️ Journal admin</a>
  </div>
</div>

  {id:75, nom:"PIAU",               prenom:"Guillaume",        cat:"E", vac:50,  sport:150, valideVac:false, valideSport:false, valideVacPar:"", valideSportPar:"", valideVacDate:"", valideSportDate:""},
  {id:76, nom:"OLLIVIER",           prenom:"Kévin",            cat:"E", vac:50,  sport:150, valideVac:false, valideSport:false, valideVacPar:"", valideSportPar:"", valideVacDate:"", valideSportDate:""},
  {id:77, nom:"FONTAINE",           prenom:"Yann",             cat:"E", vac:50,  sport:150, valideVac:false, valideSport:false, valideVacPar:"", valideSportPar:"", valideVacDate:"", valideSportDate:""},
];

let currentUser = null;
let data = [];

function loadData() {
  const saved = localStorage.getItem("cse_data");
  data = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(SALARIES));
}
function saveData() {
  localStorage.setItem("cse_data", JSON.stringify(data));
}
function loadLog() {
  return JSON.parse(localStorage.getItem("cse_log") || "[]");
}
function saveLog(log) {
  localStorage.setItem("cse_log", JSON.stringify(log));
}

function login() {
  const u = document.getElementById("input-user").value.trim();
  const p = document.getElementById("input-pass").value.trim();
  if (USERS[u] && USERS[u].pass === p) {
    currentUser = { id: u, ...USERS[u] };
    localStorage.setItem("cse_session", currentUser.role);
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("user-label").textContent = "👤 " + currentUser.nom;
    if (currentUser.role === "admin") {
      document.getElementById("admin-link").style.display = "inline";
    }
    loadData();
    renderTable();
    updateTotaux();
  } else {
    document.getElementById("login-error").textContent = "Identifiant ou mot de passe incorrect.";
  }
}

function logout() {
  currentUser = null;
  localStorage.removeItem("cse_session");
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app").style.display = "none";
  document.getElementById("input-user").value = "";
  document.getElementById("input-pass").value = "";
}

function renderTable() {
  const search = document.getElementById("search").value.toLowerCase();
  const cat = document.getElementById("filter-cat").value;
  const status = document.getElementById("filter-status").value;

  const filtered = data.filter(s => {
    const matchSearch = (s.nom + " " + s.prenom).toLowerCase().includes(search);
    const matchCat = cat ? s.cat === cat : true;
    let matchStatus = true;
    if (status === "vac_valide") matchStatus = s.valideVac;
    if (status === "sport_valide") matchStatus = s.valideSport;
    if (status === "vac_pending") matchStatus = !s.valideVac;
    if (status === "sport_pending") matchStatus = !s.valideSport;
    return matchSearch && matchCat && matchStatus;
  });

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";
  filtered.forEach((s, idx) => {
    const tr = document.createElement("tr");

    const vacCell = s.valideVac
      ? `<td class="validated">${s.vac} €</td><td><span class="badge-vac">✅ Validé</span></td>`
      : `<td><input type="text" class="edit-field" value="${s.vac}" onchange="updateVal(${s.id}, 'vac', this.value)" /></td>
         <td><button class="btn-vac" onclick="valider(${s.id}, 'vac')">✅ Valider Vacances</button></td>`;

    const sportCell = s.valideSport
      ? `<td class="validated">${s.sport} €</td><td><span class="badge-sport">✅ Validé</span></td>`
      : `<td><input type="text" class="edit-field" value="${s.sport}" onchange="updateVal(${s.id}, 'sport', this.value)" /></td>
         <td><button class="btn-sport" onclick="valider(${s.id}, 'sport')">✅ Valider Sport</button></td>`;

    tr.innerHTML = `
      <td>${idx+1}</td>
      <td>${s.nom}</td>
      <td>${s.prenom}</td>
      <td>${s.cat}</td>
      ${vacCell}
      ${sportCell}
    `;
    tbody.appendChild(tr);
  });
}

function updateVal(id, field, val) {
  const num = parseFloat(val);
  if (!isNaN(num)) {
    const s = data.find(x => x.id === id);
    if (s) {
      if (field === "vac" && !s.valideVac) { s.vac = num; saveData(); updateTotaux(); }
      if (field === "sport" && !s.valideSport) { s.sport = num; saveData(); updateTotaux(); }
    }
  }
}

function valider(id, type) {
  const s = data.find(x => x.id === id);
  if (!s) return;
  const now = new Date().toLocaleString("fr-FR");

  if (type === "vac" && !s.valideVac) {
    s.valideVac = true;
    s.valideVacPar = currentUser.nom;
    s.valideVacDate = now;
    const log = loadLog();
    log.push({ type: "Vacances", nom: s.nom, prenom: s.prenom, montant: s.vac, validePar: currentUser.nom, date: now });
    saveLog(log);
  }

  if (type === "sport" && !s.valideSport) {
    s.valideSport = true;
    s.valideSportPar = currentUser.nom;
    s.valideSportDate = now;
    const log = loadLog();
    log.push({ type: "Sport", nom: s.nom, prenom: s.prenom, montant: s.sport, validePar: currentUser.nom, date: now });
    saveLog(log);
  }

  saveData();
  renderTable();
  updateTotaux();
}

function updateTotaux() {
  const totalVacPrevu = data.reduce((a, s) => a + s.vac, 0);
  const totalVacValide = data.filter(s => s.valideVac).reduce((a, s) => a + s.vac, 0);
  const totalSportPrevu = data.reduce((a, s) => a + s.sport, 0);
  const totalSportValide = data.filter(s => s.valideSport).reduce((a, s) => a + s.sport, 0);

  document.getElementById("total-vac-prevu").textContent = totalVacPrevu + " €";
  document.getElementById("total-vac-valide").textContent = totalVacValide + " €";
  document.getElementById("total-vac-reste").textContent = (totalVacPrevu - totalVacValide) + " €";
  document.getElementById("total-sport-prevu").textContent = totalSportPrevu + " €";
  document.getElementById("total-sport-valide").textContent = totalSportValide + " €";
  document.getElementById("total-sport-reste").textContent = (totalSportPrevu - totalSportValide) + " €";
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.getElementById("login-screen").style.display !== "none") login();
});

loadData();
</script>
</body>
</html>
