    }
    .form-group { margin-bottom: 16px; }
    .form-group label {

    }
    .form-group input {
      width: 100%; padding: 10px 14px; border: 1px solid #e5e7eb;
      border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif;
      transition: border 0.2s; outline: none; color: #1a1a2e;
    }
    .form-group input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
    .btn-primary {
      width: 100%; padding: 11px; background: #1a73e8;
      color: white; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      font-family: 'Inter', sans-serif; margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #1557b0; }
    #login-error { color: #dc2626; font-size: 12px; margin-top: 12px; text-align: center; }

    #app { display: none; min-height: 100vh; }

    .header {
      background: white; border-bottom: 1px solid #e5e7eb;
      padding: 0 32px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo {
      width: 32px; height: 32px; background: #1a73e8;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
    }
    .header-logo span { color: white; font-weight: 700; font-size: 14px; }
    .header-title { font-size: 15px; font-weight: 600; color: #1a1a2e; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .header-user { font-size: 13px; color: #6b7280; }
    .btn-logout {
      padding: 7px 16px; background: transparent; border: 1px solid #e5e7eb;
      border-radius: 7px; font-size: 13px; cursor: pointer; color: #374151;
      font-family: 'Inter', sans-serif; transition: all 0.2s;
    }
    .btn-logout:hover { background: #f5f7fa; border-color: #d1d5db; }

    .main { padding: 32px; max-width: 1400px; margin: 0 auto; }

    .totaux { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-bottom: 28px; }
    .card {
      background: white; border-radius: 10px; padding: 20px;
      border: 1px solid #e5e7eb;
    }
    .card-label { font-size: 11px; font-weight: 500; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .card-value { font-size: 24px; font-weight: 600; color: #1a73e8; }
    .card-value.green { color: #16a34a; }
    .card-value.red { color: #dc2626; }

    .toolbar {
      display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;

    }
    .toolbar-left { display: flex; gap: 12px; flex-wrap: wrap; }

    .select-filter {

      font-size: 13px; font-family: 'Inter', sans-serif;
      outline: none; background: white; color: #374151; cursor: pointer;
    }
    .admin-link {

    td { padding: 12px 16px; color: #374151; }

</head>

<div id="login-screen">
  <div class="login-card">
    <h1>CSE</h1>
    <p class="subtitle">Suivi des dépenses</p>
    <div class="form-group">
      <label>Identifiant</label>
      <input type="text" id="input-user" placeholder="Votre identifiant" />
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="input-pass" placeholder="Votre mot de passe" />
    </div>
    <button class="btn-primary" onclick="login()">Se connecter</button>
    <p id="login-error"></p>
  </div>
</div>

<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="header-logo"><span>C</span></div>
      <span class="header-title">CSE — Suivi des dépenses</span>
    </div>
    <div class="header-right">
      <span class="header-user" id="user-label"></span>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <div class="main">
    <div class="totaux">
      <div class="card">
        <div class="card-label">Vacances prévu</div>
        <div class="card-value" id="total-vac-prevu">0 €</div>
      </div>
      <div class="card">
        <div class="card-label">Vacances validées</div>
        <div class="card-value green" id="total-vac-valide">0 €</div>
      </div>
      <div class="card">
        <div class="card-label">Vacances restantes</div>
        <div class="card-value red" id="total-vac-reste">0 €</div>
      </div>
      <div class="card">
        <div class="card-label">Sport prévu</div>
        <div class="card-value" id="total-sport-prevu">0 €</div>
      </div>
      <div class="card">
        <div class="card-label">Sport validé</div>
        <div class="card-value green" id="total-sport-valide">0 €</div>
      </div>
      <div class="card">
        <div class="card-label">Sport restant</div>
        <div class="card-value red" id="total-sport-reste">0 €</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <input type="text" class="search-input" id="search" placeholder="Rechercher un nom..." oninput="renderTable()" />
        <select class="select-filter" id="filter-cat" onchange="renderTable()">
          <option value="">Toutes catégories</option>
          <option value="A">Catégorie A</option>
          <option value="B">Catégorie B</option>
          <option value="C">Catégorie C</option>
          <option value="D">Catégorie D</option>
          <option value="E">Catégorie E</option>
        </select>
        <select class="select-filter" id="filter-status" onchange="renderTable()">
          <option value="">Tous statuts</option>
          <option value="vac_valide">Vacances validées</option>
          <option value="sport_valide">Sport validé</option>
          <option value="vac_pending">Vacances en attente</option>
          <option value="sport_pending">Sport en attente</option>
        </select>
      </div>
      <a href="admin.html" id="admin-link" class="admin-link" style="display:none">Journal des validations</a>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Cat.</th>
            <th>Vacances</th>
            <th>Statut</th>
            <th>Sport</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
</div>

let currentUser = null;
let data = [];

function loadData() {
  const saved = localStorage.getItem("cse_data");
  data = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(SALARIES));
}
function saveData() {
  localStorage.setItem("cse_data", JSON.stringify(data));
}
function loadLog() {
  return JSON.parse(localStorage.getItem("cse_log") || "[]");
}
function saveLog(log) {
  localStorage.setItem("cse_log", JSON.stringify(log));
}

function login() {
  const u = document.getElementById("input-user").value.trim();
  const p = document.getElementById("input-pass").value.trim();
  if (USERS[u] && USERS[u].pass === p) {
    currentUser = { id: u, ...USERS[u] };
    localStorage.setItem("cse_session", currentUser.role);
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("user-label").textContent = currentUser.nom;
    if (currentUser.role === "admin") {
      document.getElementById("admin-link").style.display = "inline";
    }
    loadData();
    renderTable();
    updateTotaux();
  } else {
    document.getElementById("login-error").textContent = "Identifiant ou mot de passe incorrect.";
  }
}

function logout() {
  currentUser = null;
  localStorage.removeItem("cse_session");
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app").style.display = "none";
  document.getElementById("input-user").value = "";
  document.getElementById("input-pass").value = "";
}

function renderTable() {
  const search = document.getElementById("search").value.toLowerCase();
  const cat = document.getElementById("filter-cat").value;
  const status = document.getElementById("filter-status").value;

  const filtered = data.filter(s => {
    const matchSearch = (s.nom + " " + s.prenom).toLowerCase().includes(search);
    const matchCat = cat ? s.cat === cat : true;
    let matchStatus = true;
    if (status === "vac_valide")   matchStatus = s.valideVac;
    if (status === "sport_valide") matchStatus = s.valideSport;
    if (status === "vac_pending")  matchStatus = !s.valideVac;
    if (status === "sport_pending") matchStatus = !s.valideSport;
    return matchSearch && matchCat && matchStatus;
  });

  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";
  filtered.forEach((s, idx) => {
    const vacCell = s.valideVac
      ? `<td class="dim">${s.vac} €</td><td><span class="badge badge-vac">Validé</span></td>`
      : `<td><input type="text" class="edit-field" value="${s.vac}" onchange="updateVal(${s.id}, 'vac', this.value)" /></td>
         <td><button class="btn-vac" onclick="valider(${s.id}, 'vac')">Valider</button></td>`;

    const sportCell = s.valideSport
      ? `<td class="dim">${s.sport} €</td><td><span class="badge badge-sport">Validé</span></td>`
      : `<td><input type="text" class="edit-field" value="${s.sport}" onchange="updateVal(${s.id}, 'sport', this.value)" /></td>
         <td><button class="btn-sport" onclick="valider(${s.id}, 'sport')">Valider</button></td>`;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td style="color:#9ca3af">${idx+1}</td>
      <td style="font-weight:500">${s.nom}</td>
      <td>${s.prenom}</td>
      <td><span class="cat-badge">${s.cat}</span></td>
      ${vacCell}
      ${sportCell}
    `;
    tbody.appendChild(tr);
  });
}

function updateVal(id, field, val) {
  const num = parseFloat(val);
  if (!isNaN(num)) {
    const s = data.find(x => x.id === id);
    if (s) {
      if (field === "vac" && !s.valideVac) { s.vac = num; saveData(); updateTotaux(); }
      if (field === "sport" && !s.valideSport) { s.sport = num; saveData(); updateTotaux(); }
    }
  }
}

function valider(id, type) {
  const s = data.find(x => x.id === id);
  if (!s) return;
  const now = new Date().toLocaleString("fr-FR");
  if (type === "vac" && !s.valideVac) {
    s.valideVac = true; s.valideVacPar = currentUser.nom; s.valideVacDate = now;
    const log = loadLog();
    log.push({ type: "Vacances", nom: s.nom, prenom: s.prenom, montant: s.vac, validePar: currentUser.nom, date: now });
    saveLog(log);
  }
  if (type === "sport" && !s.valideSport) {
    s.valideSport = true; s.valideSportPar = currentUser.nom; s.valideSportDate = now;
    const log = loadLog();
    log.push({ type: "Sport", nom: s.nom, prenom: s.prenom, montant: s.sport, validePar: currentUser.nom, date: now });
    saveLog(log);
  }
  saveData(); renderTable(); updateTotaux();
}

function updateTotaux() {
  const totalVacPrevu   = SALARIES.reduce((a, s) => a + MONTANTS_FIXES[s.cat].vac, 0);
  const totalSportPrevu = SALARIES.reduce((a, s) => a + MONTANTS_FIXES[s.cat].sport, 0);
  const totalVacValide   = data.filter(s => s.valideVac).reduce((a, s) => a + s.vac, 0);
  const totalSportValide = data.filter(s => s.valideSport).reduce((a, s) => a + s.sport, 0);

  document.getElementById("total-vac-prevu").textContent   = totalVacPrevu + " €";
  document.getElementById("total-vac-valide").textContent  = totalVacValide + " €";
  document.getElementById("total-vac-reste").textContent   = (totalVacPrevu - totalVacValide) + " €";
  document.getElementById("total-sport-prevu").textContent  = totalSportPrevu + " €";
  document.getElementById("total-sport-valide").textContent = totalSportValide + " €";
  document.getElementById("total-sport-reste").textContent  = (totalSportPrevu - totalSportValide) + " €";
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.getElementById("login-screen").style.display !== "none") login();
});

loadData();
</script>
