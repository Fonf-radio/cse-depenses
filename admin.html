<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSE - Journal Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; padding: 30px; }
    h1 { color: #1a73e8; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: white;
      border-radius: 8px; overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    thead { background: #1a73e8; color: white; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; }
    tbody tr:hover { background: #e8f0fe; }
    .back { display: inline-block; margin-bottom: 20px; color: #1a73e8;
      text-decoration: none; font-size: 14px; }
    .back:hover { text-decoration: underline; }
    .export-btn {
      background: #34a853; color: white; border: none;
      padding: 8px 18px; border-radius: 6px; cursor: pointer;
      font-size: 14px; margin-bottom: 16px;
    }
    #access-denied { display: none; color: red; font-size: 18px; margin-top: 40px; text-align: center; }
    #content { display: none; }
  </style>
</head>
<body>

<div id="access-denied">⛔ Accès réservé à l'administrateur.</div>

<div id="content">
  <a class="back" href="index.html">← Retour au tableau</a>
  <h1>📋 Journal des validations</h1>
  <button class="export-btn" onclick="exportCSV()">⬇️ Exporter en CSV</button>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Validé par</th>
        <th>Date & heure</th>
      </tr>
    </thead>
    <tbody id="log-body"></tbody>
  </table>
</div>

<script>
  const session = localStorage.getItem("cse_session");
  if (session !== "admin") {
    document.getElementById("access-denied").style.display = "block";
  } else {
    document.getElementById("content").style.display = "block";
    const log = JSON.parse(localStorage.getItem("cse_log") || "[]");
    const tbody = document.getElementById("log-body");
    if (log.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888">Aucune validation enregistrée.</td></tr>';
    } else {
      log.forEach((entry, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${i+1}</td><td>${entry.nom}</td><td>${entry.prenom}</td>
                        <td>${entry.validePar}</td><td>${entry.date}</td>`;
        tbody.appendChild(tr);
      });
    }
  }

  function exportCSV() {
    const log = JSON.parse(localStorage.getItem("cse_log") || "[]");
    let csv = "Nom,Prénom,Validé par,Date\n";
    log.forEach(e => { csv += `${e.nom},${e.prenom},${e.validePar},${e.date}\n`; });
    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "journal_validations_CSE.csv";
    a.click();
  }
</script>
</body>
</html>
